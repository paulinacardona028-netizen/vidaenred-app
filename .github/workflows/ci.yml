# Integración continua: pruebas del backend, verificación de la app y análisis de calidad.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (pruebas y cobertura)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vida
          POSTGRES_PASSWORD: vida
          POSTGRES_DB: vidaenred_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vida"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://vida:vida@localhost:5432/vidaenred_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Pruebas con cobertura
        run: npm run test:cobertura
      - name: Subir reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-backend
          path: backend/coverage/lcov.info

  app:
    name: App móvil (verificación de tipos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compilar TypeScript en modo estricto
        run: npx tsc --noEmit

  sonar:
    name: Análisis de calidad (SonarCloud)
    needs: [backend, app]
    if: ${{ secrets.SONAR_TOKEN != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generar cobertura
        working-directory: backend
        run: |
          npm ci
          npm run test:cobertura || true
      - uses: SonarSource/sonarcloud-github-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
